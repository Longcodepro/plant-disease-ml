<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --foreground: #e2e8f0;
      --muted-foreground: #94a3b8;
      --card: #1e293b;
      --card-border: #334155;
    }
    input[type=range] {
      accent-color: #3b82f6;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2 m-0 select-none font-sans text-xs">
  <div class="space-y-2 max-w-4xl mx-auto">
    <!-- Header / Stats Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 p-2 rounded-lg bg-[var(--card)] border border-[var(--card-border)]">
      <div class="flex items-center gap-3">
        <div>
          <span class="text-[var(--muted-foreground)] block">Hệ số (w):</span>
          <span id="stat-w" class="font-mono text-sm font-bold text-blue-400">0.00</span>
        </div>
        <div>
          <span class="text-[var(--muted-foreground)] block">Sai số (Loss):</span>
          <span id="stat-loss" class="font-mono text-sm font-bold text-amber-400">0.00</span>
        </div>
        <div>
          <span class="text-[var(--muted-foreground)] block">Độ dốc (Đạo hàm):</span>
          <span id="stat-grad" class="font-mono text-sm font-bold text-emerald-400">0.00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-2">
        <button id="btn-step" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded font-medium transition active:scale-95">
          Bước 1 bước 👟
        </button>
        <button id="btn-auto" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium transition active:scale-95">
          Tự động lăn ▶
        </button>
        <button id="btn-reset" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded font-medium transition">
          Đặt lại ↺
        </button>
      </div>
    </div>

    <!-- Sliders -->
    <div class="grid grid-cols-2 gap-3 p-2 rounded-lg bg-[var(--card)] border border-[var(--card-border)]">
      <div class="flex items-center justify-between gap-2">
        <label class="text-[var(--muted-foreground)] whitespace-nowrap">
          Vị trí bóng ban đầu (<span class="font-mono font-bold text-[var(--foreground)]">w</span>):
        </label>
        <input id="slider-w" type="range" min="-100" max="500" value="0" step="5" class="w-28" />
        <span id="val-w-slider" class="font-mono text-blue-400 w-10 text-right">0</span>
      </div>
      <div class="flex items-center justify-between gap-2">
        <label class="text-[var(--muted-foreground)] whitespace-nowrap" title="Learning Rate - Bước chân nhảy dài hay ngắn">
          Tốc độ học (<span class="font-mono font-bold text-[var(--foreground)]">&alpha;</span>):
        </label>
        <input id="slider-lr" type="range" min="0.05" max="1.3" value="0.3" step="0.05" class="w-28" />
        <span id="val-lr" class="font-mono text-emerald-400 w-10 text-right">0.30</span>
      </div>
    </div>

    <!-- Canvas Visualization (2 columns) -->
    <div class="grid grid-cols-2 gap-2">
      <!-- Chart 1: Bowl Curve -->
      <div class="p-2 rounded-lg bg-[var(--card)] border border-[var(--card-border)] relative">
        <div class="text-[11px] font-semibold text-slate-300 mb-1 flex justify-between">
          <span>1. Thung Lũng Sai Số J(w) (Lòng chảo)</span>
          <span id="ball-status" class="text-xs text-blue-400">Sẵn sàng lăn</span>
        </div>
        <canvas id="canvas-bowl" width="360" height="200" class="w-full h-[200px]"></canvas>
      </div>

      <!-- Chart 2: Fitting Line -->
      <div class="p-2 rounded-lg bg-[var(--card)] border border-[var(--card-border)] relative">
        <div class="text-[11px] font-semibold text-slate-300 mb-1 flex justify-between">
          <span>2. Đường Hồi Quy Dự Đoán (y = wx + 100)</span>
          <span class="text-xs text-slate-400">Dữ liệu: (1, 300) và (2, 500)</span>
        </div>
        <canvas id="canvas-fit" width="360" height="200" class="w-full h-[200px]"></canvas>
      </div>
    </div>

    <!-- Intuitive Footer Note -->
    <div class="text-[11px] text-[var(--muted-foreground)] px-1 flex items-center justify-between">
      <span>💡 <b>Mẹo:</b> Thử tăng &alpha; lên > 1.0 rồi bấm <i>"Bước 1 bước"</i> để xem hiện tượng bóng văng khỏi chảo (Overshoot)!</span>
    </div>
  </div>

  <script>
    // Data setup: x=[1, 2], y=[300, 500], fixed b = 100 -> optimal w = 200
    // Model: f(x) = w*x + 100
    // J(w) = 1/(2*m) * [ (w*1 + 100 - 300)^2 + (w*2 + 100 - 500)^2 ]
    //      = 1/4 * [ (w - 200)^2 + 4*(w - 200)^2 ] = 1.25 * (w - 200)^2
    // dJ/dw = 2.5 * (w - 200)

    let currentW = 0.0;
    let alpha = 0.3;
    let autoInterval = null;
    let historyPath = [currentW];

    function getLoss(w) {
      return 1.25 * Math.pow(w - 200, 2);
    }

    function getGradient(w) {
      return 2.5 * (w - 200);
    }

    // UI elements
    const statW = document.getElementById('stat-w');
    const statLoss = document.getElementById('stat-loss');
    const statGrad = document.getElementById('stat-grad');
    const ballStatus = document.getElementById('ball-status');
    const sliderW = document.getElementById('slider-w');
    const valWSlider = document.getElementById('val-w-slider');
    const sliderLr = document.getElementById('slider-lr');
    const valLr = document.getElementById('val-lr');
    const btnStep = document.getElementById('btn-step');
    const btnAuto = document.getElementById('btn-auto');
    const btnReset = document.getElementById('btn-reset');

    const canvasBowl = document.getElementById('canvas-bowl');
    const ctxBowl = canvasBowl.getContext('2d');
    const canvasFit = document.getElementById('canvas-fit');
    const ctxFit = canvasFit.getContext('2d');

    function updateStats() {
      statW.textContent = currentW.toFixed(2);
      const loss = getLoss(currentW);
      statLoss.textContent = loss.toFixed(1);
      const grad = getGradient(currentW);
      statGrad.textContent = (grad >= 0 ? '+' : '') + grad.toFixed(2);

      if (Math.abs(currentW - 200) < 1.0) {
        ballStatus.textContent = '🎯 Đã chạm đáy (Tối ưu!)';
        ballStatus.className = 'text-xs text-emerald-400 font-bold';
      } else if (Math.abs(currentW - 200) > 400) {
        ballStatus.textContent = '⚠️ Bóng văng khỏi thung lũng!';
        ballStatus.className = 'text-xs text-rose-400 font-bold';
      } else {
        ballStatus.textContent = 'Đang lăn xuống dốc...';
        ballStatus.className = 'text-xs text-blue-400';
      }
    }

    function step() {
      const grad = getGradient(currentW);
      // w = w - alpha * grad
      currentW = currentW - alpha * grad;
      historyPath.push(currentW);
      if (historyPath.length > 30) historyPath.shift();
      updateStats();
      draw();
    }

    function reset(startW = 0) {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        btnAuto.textContent = 'Tự động lăn ▶';
        btnAuto.classList.replace('bg-amber-600', 'bg-emerald-600');
      }
      currentW = startW;
      historyPath = [currentW];
      sliderW.value = startW;
      valWSlider.textContent = startW;
      updateStats();
      draw();
    }

    // Drawing Canvas 1: Bowl Curve
    function drawBowl() {
      const w = canvasBowl.width;
      const h = canvasBowl.height;
      ctxBowl.clearRect(0, 0, w, h);

      // Coordinate mapping: w in [-50, 450] -> x in [30, w-30]
      // Loss in [0, 80000] -> y in [h-25, 20]
      const mapX = (val) => 30 + ((val - (-50)) / 500) * (w - 60);
      const mapY = (loss) => (h - 25) - (loss / 80000) * (h - 45);

      // Grid & Axes
      ctxBowl.strokeStyle = '#334155';
      ctxBowl.lineWidth = 1;
      ctxBowl.beginPath();
      ctxBowl.moveTo(30, h - 25);
      ctxBowl.lineTo(w - 20, h - 25);
      ctxBowl.stroke();

      // Axis labels
      ctxBowl.fillStyle = '#94a3b8';
      ctxBowl.font = '10px sans-serif';
      ctxBowl.fillText('w = 200 (Đáy)', mapX(200) - 25, h - 8);
      ctxBowl.fillText('J(w)', 5, 25);

      // Draw Parabolic Bowl curve
      ctxBowl.strokeStyle = '#38bdf8';
      ctxBowl.lineWidth = 2.5;
      ctxBowl.beginPath();
      for (let val = -50; val <= 450; val += 5) {
        const px = mapX(val);
        const py = mapY(getLoss(val));
        if (val === -50) ctxBowl.moveTo(px, py);
        else ctxBowl.lineTo(px, py);
      }
      ctxBowl.stroke();

      // Draw path of the ball
      if (historyPath.length > 1) {
        ctxBowl.strokeStyle = 'rgba(251, 191, 36, 0.4)';
        ctxBowl.lineWidth = 2;
        ctxBowl.setLineDash([3, 3]);
        ctxBowl.beginPath();
        historyPath.forEach((ptW, idx) => {
          const px = mapX(ptW);
          const py = mapY(getLoss(ptW));
          if (idx === 0) ctxBowl.moveTo(px, py);
          else ctxBowl.lineTo(px, py);
        });
        ctxBowl.stroke();
        ctxBowl.setLineDash([]);
      }

      // Draw Ball
      const ballX = mapX(currentW);
      const ballY = mapY(getLoss(currentW));

      // Tangent slope indicator line
      const grad = getGradient(currentW);
      ctxBowl.strokeStyle = '#f43f5e';
      ctxBowl.lineWidth = 2;
      ctxBowl.beginPath();
      ctxBowl.moveTo(ballX - 25, ballY - (-grad * 0.1));
      ctxBowl.lineTo(ballX + 25, ballY + (-grad * 0.1));
      ctxBowl.stroke();

      // Glowing ball
      ctxBowl.fillStyle = '#f59e0b';
      ctxBowl.beginPath();
      ctxBowl.arc(ballX, ballY, 7, 0, Math.PI * 2);
      ctxBowl.fill();
      ctxBowl.strokeStyle = '#ffffff';
      ctxBowl.lineWidth = 1.5;
      ctxBowl.stroke();
    }

    // Drawing Canvas 2: Line Fit
    function drawFit() {
      const w = canvasFit.width;
      const h = canvasFit.height;
      ctxFit.clearRect(0, 0, w, h);

      // Mapping: x in [0, 3] -> px in [35, w-20]
      // y in [0, 700] -> py in [h-25, 20]
      const mapX = (x) => 35 + (x / 3) * (w - 55);
      const mapY = (y) => (h - 25) - (y / 700) * (h - 45);

      // Axes
      ctxFit.strokeStyle = '#334155';
      ctxFit.lineWidth = 1;
      ctxFit.beginPath();
      ctxFit.moveTo(35, 15);
      ctxFit.lineTo(35, h - 25);
      ctxFit.lineTo(w - 15, h - 25);
      ctxFit.stroke();

      ctxFit.fillStyle = '#94a3b8';
      ctxFit.font = '10px sans-serif';
      ctxFit.fillText('x', w - 10, h - 20);
      ctxFit.fillText('y', 20, 20);

      // Data Points: (1, 300), (2, 500)
      const pts = [{ x: 1, y: 300 }, { x: 2, y: 500 }];
      pts.forEach(p => {
        const px = mapX(p.x);
        const py = mapY(p.y);

        // Target marker 'x'
        ctxFit.strokeStyle = '#ef4444';
        ctxFit.lineWidth = 2.5;
        ctxFit.beginPath();
        ctxFit.moveTo(px - 5, py - 5); ctxFit.lineTo(px + 5, py + 5);
        ctxFit.moveTo(px + 5, py - 5); ctxFit.lineTo(px - 5, py + 5);
        ctxFit.stroke();

        // Residue vertical error line
        const predY = currentW * p.x + 100;
        ctxFit.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctxFit.setLineDash([2, 2]);
        ctxFit.beginPath();
        ctxFit.moveTo(px, py);
        ctxFit.lineTo(px, mapY(predY));
        ctxFit.stroke();
        ctxFit.setLineDash([]);
      });

      // Prediction Line: y = w*x + 100
      const x0 = 0, y0 = currentW * 0 + 100;
      const x1 = 3, y1 = currentW * 3 + 100;
      ctxFit.strokeStyle = '#3b82f6';
      ctxFit.lineWidth = 2.5;
      ctxFit.beginPath();
      ctxFit.moveTo(mapX(x0), mapY(y0));
      ctxFit.lineTo(mapX(x1), mapY(y1));
      ctxFit.stroke();
    }

    function draw() {
      drawBowl();
      drawFit();
    }

    // Events
    btnStep.addEventListener('click', step);

    btnAuto.addEventListener('click', () => {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        btnAuto.textContent = 'Tự động lăn ▶';
        btnAuto.classList.replace('bg-amber-600', 'bg-emerald-600');
      } else {
        btnAuto.textContent = 'Tạm dừng ⏸';
        btnAuto.classList.replace('bg-emerald-600', 'bg-amber-600');
        autoInterval = setInterval(() => {
          if (Math.abs(currentW - 200) < 0.2 || Math.abs(currentW - 200) > 450) {
            clearInterval(autoInterval);
            autoInterval = null;
            btnAuto.textContent = 'Tự động lăn ▶';
            btnAuto.classList.replace('bg-amber-600', 'bg-emerald-600');
            return;
          }
          step();
        }, 120);
      }
    });

    btnReset.addEventListener('click', () => reset(0));

    sliderW.addEventListener('input', (e) => {
      valWSlider.textContent = e.target.value;
      reset(parseFloat(e.target.value));
    });

    sliderLr.addEventListener('input', (e) => {
      alpha = parseFloat(e.target.value);
      valLr.textContent = alpha.toFixed(2);
    });

    // Initial render
    updateStats();
    draw();
  </script>
</body>
</html>
