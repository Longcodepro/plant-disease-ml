<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vở Ghi Học Tập Machine Learning - Tuần 2</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #dee2e6;
      --card-bg: #f8f9fa;
      --quote-border: #0d6efd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1b;
        --text: #e8e6e3;
        --text-muted: #9a948d;
        --border: #343a40;
        --card-bg: #212529;
        --quote-border: #3d8bfd;
      }
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.65;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px 0;
    }
    .meta {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    h2 {
      font-size: 1.2rem;
      margin-top: 24px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    h3 {
      font-size: 1rem;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    p, ul {
      margin-top: 0;
      margin-bottom: 12px;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin-bottom: 6px;
    }
    .note-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      margin: 12px 0;
    }
    .empty-notice {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Vở Ghi Học Tập Machine Learning - Tuần 2</h1>
      <div class="meta">Bài giảng GS. Andrew Ng (DeepLearning.AI) • Slide C1_W2.pdf</div>
    </header>

    <main id="content">
      <div class="empty-notice">
        (Nội dung Tuần 2 sẽ được ghi chép vào đây sau khi bạn pass từng phần kiểm tra)
      </div>
    </main>
  </div>
</body>
</html>
